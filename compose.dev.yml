# Local rehearsal stack: production images built from this checkout, against a
# throwaway PostgreSQL seeded from a production dump in ./data/dumps.
name: lithharbor-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/dumps:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 30

  lithharbor-php:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ./data/files:/var/www/html/forum/files
      - ./data/store:/var/www/html/forum/store
      - ./data/cache:/var/www/html/forum/cache
      - ./data/avatars:/var/www/html/forum/images/avatars/upload

  lithharbor-nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    depends_on:
      - lithharbor-php
    networks:
      - internal
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./data/avatars:/var/www/html/forum/images/avatars/upload:ro

volumes:
  postgres_data:

networks:
  internal:
