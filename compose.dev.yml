services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-connections=200
      - --skip-name-resolve
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./data/dumps:/dumps:ro
    networks:
      - mariadb
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lithharbor}
      POSTGRES_USER: ${DB_USER:-lithharbor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - postgres
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  mariadb:
  postgres:

volumes:
  mariadb-data:
  postgres-data:
